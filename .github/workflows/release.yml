name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '27.0'

jobs:
  build:
    # Xcode 27 carries Swift 6.4 and the macOS 27 SDK, which the manifest needs.
    # No macos-27 runner label exists yet, so the xcode-27 preview image is the
    # only hosted image that holds them. Its host still runs macOS 26.5.
    runs-on: xcode-27

    # Every toba package reads TOBA_STATIC_LINK and drops its .dynamic product
    # type when the variable is set. sm is one executable image, so a static
    # link removes the @rpath dylibs the archive would otherwise have to carry.
    # The variable sits on the job because SwiftPM evaluates the manifest during
    # resolve as well as during build, and the two must agree.
    env:
      TOBA_STATIC_LINK: '1'

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache SPM dependencies
      uses: actions/cache@v5
      with:
        path: .build
        # The workflow file joins the key because a failed resolve saves a
        # .build that holds half-cloned repositories. Editing the workflow
        # then retires that entry instead of restoring it.
        key: spm-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/release.yml') }}
        restore-keys: spm-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
        save-always: true

    # A tag carries a leading "v" or omits it. Later steps read VERSION and TAG
    # instead of slicing the ref again.
    - name: Resolve the tag and the version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

    - name: Embed version
      run: sed -i '' "s/let smVersion = \".*\"/let smVersion = \"$VERSION\"/" Sources/Swiftiomatic/Version.swift

    # toba-core and toba-concurrency are private. SwiftPM clones them over
    # https with no credential, so the rewrite supplies one. Each rewrite names
    # one repository, which keeps the credential off every other toba URL.
    - name: Authenticate to the private toba repositories
      env:
        TOBA_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        for repo in toba-core toba-concurrency; do
          git config --global \
            url."https://x-access-token:${TOBA_TOKEN}@github.com/toba/${repo}".insteadOf \
            "https://github.com/toba/${repo}"
        done

    # The cap turns a stalled artifact download into a fast failure. A stall
    # otherwise holds the runner for the full six hour job limit.
    #
    # The binary artifact of swiftiomatic-plugins sits on a public release, so
    # it needs no credential. The two flags stop SwiftPM from consulting the
    # keychain and netrc for one, because that lookup blocks on a headless
    # runner and the download then never starts.
    - name: Resolve dependencies
      timeout-minutes: 10
      run: swift package resolve --disable-keychain --disable-netrc

    - name: Build release binary
      run: swift build -c release --product sm --disable-sandbox

    - name: Create archive
      run: |
        mkdir -p dist
        cp .build/release/sm dist/
        cd dist && tar -czvf ../sm-${{ github.ref_name }}-arm64.tar.gz *

    # The extraction directory holds nothing but the archive contents, so a
    # dylib left in .build cannot satisfy the launch. Release 4.0.0 shipped a
    # binary that aborted in dyld, and this step is what refuses that build.
    - name: Verify the archive launches
      run: |
        rm -rf verify && mkdir -p verify
        tar -xzf sm-${{ github.ref_name }}-arm64.tar.gz -C verify
        ./scripts/verify-release.sh verify/sm

    - name: Generate SHA256
      run: shasum -a 256 sm-${{ github.ref_name }}-arm64.tar.gz > sm-${{ github.ref_name }}-arm64.tar.gz.sha256

    - name: Build artifact bundle
      run: ./scripts/build-artifactbundle.sh "$VERSION"

    - name: Generate release notes
      run: |
        PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1)
        if [ -z "$PREV_TAG" ]; then
          NOTES=$(git log --pretty=format:"- %s" HEAD)
        else
          NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
        fi
        echo "$NOTES" > release_notes.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          sm-${{ github.ref_name }}-arm64.tar.gz
          sm-${{ github.ref_name }}-arm64.tar.gz.sha256
          build/sm.artifactbundle.zip
          build/sm.artifactbundle.zip.sha256
        body_path: release_notes.txt

  update-homebrew:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          SHA=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.tar.gz.sha256" -O - | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/toba/homebrew-tap.git" tap
          cd tap

          cat > Formula/sm.rb << 'FORMULA'
          class Sm < Formula
            desc "AST-based Swift code analysis CLI — lint, format, and detect anti-patterns"
            homepage "https://github.com/toba/swiftiomatic"
            url "URL_PLACEHOLDER"
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "MIT"

            depends_on :macos => :golden_gate
            depends_on arch: :arm64

            def install
              bin.install "sm"
            end

            def caveats
              <<~EOS
                To use sm as Xcode's swift-format, run:
                  sudo ln -sf #{bin}/sm /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift-format

                Re-run after Xcode updates (the symlink gets overwritten).
              EOS
            end

            test do
              assert_match "AST-based", shell_output("#{bin}/sm --help")
            end
          end
          FORMULA

          sed -i 's/^          //' Formula/sm.rb
          sed -i "s|URL_PLACEHOLDER|https://github.com/toba/swiftiomatic/releases/download/${TAG}/sm-${TAG}-arm64.tar.gz|" Formula/sm.rb
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/sm.rb
          sed -i "s|SHA_PLACEHOLDER|${SHA}|" Formula/sm.rb

          git rm -f Formula/swiftiomatic.rb 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sm.rb
          git commit -m "bump to ${VERSION}"
          git push

  update-plugins:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Bump swiftiomatic-plugins binaryTarget
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          SHA=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "sm.artifactbundle.zip.sha256" -O - | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/toba/swiftiomatic-plugins.git" plugins
          cd plugins

          URL="https://github.com/toba/swiftiomatic/releases/download/${TAG}/sm.artifactbundle.zip"
          sed -i \
            -e "s|url: \"https://github.com/toba/swiftiomatic/releases/download/[^\"]*\"|url: \"${URL}\"|" \
            -e "s|checksum: \"[0-9a-f]\{64\}\"|checksum: \"${SHA}\"|" \
            Package.swift

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          if git diff --cached --quiet; then
            echo "no change to Package.swift; skipping commit"
            exit 0
          fi
          git commit -m "bump sm to ${VERSION}"
          git tag "${TAG}"
          git push origin main "${TAG}"
