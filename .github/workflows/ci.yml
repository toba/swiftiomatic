name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '27.0'

jobs:
  test:
    # Xcode 27 carries Swift 6.4 and the macOS 27 SDK, which the manifest needs.
    # No macos-27 runner label exists yet, so the xcode-27 preview image is the
    # only hosted image that holds them. Its host still runs macOS 26.5.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache SPM build
      uses: actions/cache@v5
      with:
        path: .build
        # The workflow file joins the key because a failed resolve saves a
        # .build that holds half-cloned repositories. Editing the workflow
        # then retires that entry instead of restoring it.
        key: spm-debug-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/ci.yml') }}
        restore-keys: spm-debug-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
        save-always: true

    # Every toba dependency of this manifest is private. SwiftPM clones them
    # over https with no credential, so the rewrite supplies one. A fork pull
    # request gets no secret and still fails here. Each rewrite names one
    # repository, which keeps the credential off every other toba URL. Add a
    # repository here whenever the manifest gains a toba dependency.
    - name: Authenticate to the private toba repositories
      env:
        TOBA_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        for repo in toba-core toba-concurrency toba-benchmark; do
          git config --global \
            url."https://x-access-token:${TOBA_TOKEN}@github.com/toba/${repo}".insteadOf \
            "https://github.com/toba/${repo}"
        done

    # The cap turns a stalled artifact download into a fast failure. A stall
    # otherwise holds the runner for the full six hour job limit.
    #
    # The binary artifact of swiftiomatic-plugins sits on a public release, so
    # it needs no credential. The two flags stop SwiftPM from consulting the
    # keychain and netrc for one, because that lookup blocks on a headless
    # runner and the download then never starts. This job only escapes the
    # stall while the cache stays warm and holds the artifact already.
    - name: Resolve dependencies
      timeout-minutes: 10
      run: swift package resolve --disable-keychain --disable-netrc

    - name: Test
      run: |
        swift test --parallel --disable-sandbox 2>&1 | tee test-output.log || true
        if grep -q '✘' test-output.log; then
          echo "::error::Test failures detected"
          grep '✘' test-output.log
          exit 1
        fi
        echo "All tests passed"
