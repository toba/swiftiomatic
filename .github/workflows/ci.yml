name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.4'

jobs:
  test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6

    # Temporary probe. The release job stalls forever on this exact download
    # inside swift package resolve. The probe separates runner egress from
    # SwiftPM. Remove it once the cause is known.
    - name: Probe the binary artifact download
      timeout-minutes: 3
      run: |
        curl -sS -o /dev/null -L --max-time 120 \
          -w 'http=%{http_code} size=%{size_download} time=%{time_total}\n' \
          https://github.com/toba/swiftiomatic/releases/download/v3.13.2/sm.artifactbundle.zip

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache SPM build
      uses: actions/cache@v5
      with:
        path: .build
        # The workflow file joins the key because a failed resolve saves a
        # .build that holds half-cloned repositories. Editing the workflow
        # then retires that entry instead of restoring it.
        key: spm-debug-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved', '.github/workflows/ci.yml') }}
        restore-keys: spm-debug-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
        save-always: true

    # toba-core and toba-concurrency are private. SwiftPM clones them over
    # https with no credential, so the rewrite supplies one. A fork pull
    # request gets no secret and still fails here. Each rewrite names one
    # repository. A rewrite of the whole toba prefix also matches the public
    # release asset that the swiftiomatic-plugins binary target downloads, and
    # that download then stalls with no bytes transferred.
    - name: Authenticate to the private toba repositories
      env:
        TOBA_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        for repo in toba-core toba-concurrency; do
          git config --global \
            url."https://x-access-token:${TOBA_TOKEN}@github.com/toba/${repo}".insteadOf \
            "https://github.com/toba/${repo}"
        done

    # The cap turns a stalled artifact download into a fast failure. A stall
    # otherwise holds the runner for the full six hour job limit.
    - name: Resolve dependencies
      timeout-minutes: 10
      run: swift package resolve

    - name: Test
      run: |
        swift test --parallel --disable-sandbox 2>&1 | tee test-output.log || true
        if grep -q '✘' test-output.log; then
          echo "::error::Test failures detected"
          grep '✘' test-output.log
          exit 1
        fi
        echo "All tests passed"
